name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**/*.md']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets
        run: pnpm build

      - name: Stage web assets into the Android app
        run: |
          set -euo pipefail
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -a dist/. android/app/src/main/assets/www/
          echo "staged $(find android/app/src/main/assets/www -type f | wc -l) files, $(du -sh android/app/src/main/assets/www | cut -f1)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "${SDK}" ] || [ ! -d "${SDK}" ]; then
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
            mv /tmp/cmdline-tools/cmdline-tools "$SDK/cmdline-tools/latest"
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > android/local.properties
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ] && [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "SDK=$SDK"
          echo "sdkmanager=$SDKMGR"
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" --sdk_root="$SDK" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          fi
          ls "$SDK/platforms" "$SDK/build-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release + debug APK
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "web version: $VERSION"
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            -PwebVersionName="$VERSION" \
            -PversionCode="${{ github.run_number }}" \
            assembleRelease assembleDebug

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p out
          find android/app/build/outputs/apk -name '*.apk' -print -exec cp {} out/ \;
          ls -lh out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chat-demo-android-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
