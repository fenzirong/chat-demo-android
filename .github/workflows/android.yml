name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets
        run: pnpm build

      - name: Stage web assets into the Android app
        run: |
          set -euo pipefail
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -a dist/. android/app/src/main/assets/www/
          echo "staged $(find android/app/src/main/assets/www -type f | wc -l) files, $(du -sh android/app/src/main/assets/www | cut -f1)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release + debug APK
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          echo "web version: $VERSION"
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            -PwebVersionName="$VERSION" \
            -PversionCode="${{ github.run_number }}" \
            assembleRelease assembleDebug

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p out
          find android/app/build/outputs/apk -name '*.apk' -print -exec cp {} out/ \;
          ls -lh out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chat-demo-android-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
